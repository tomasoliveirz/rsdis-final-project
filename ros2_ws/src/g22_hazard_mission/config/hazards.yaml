    type: gas
    x: -3.5
    y: 0.5
    strength: 50.0

  - name: radiation_1
    type: radiation
    x: 6.5
    y: -3.0
    strength: 20.0

  - name: gas_leak_2
    type: gas
    x: 12.5
    y: 5.5
    strength: 40.0
