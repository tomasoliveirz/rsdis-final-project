# Clock and UAV topics. The UAV ones come from the plugins in x3_uav/model.sdf.

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# velocity command, body frame
- ros_topic_name: "/uav1/cmd_vel"
  gz_topic_name: "/uav1/gazebo/command/twist"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# send true to start the motors
- ros_topic_name: "/uav1/enable"
  gz_topic_name: "/uav1/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# odometry, world frame
- ros_topic_name: "/uav1/odom"
  gz_topic_name: "/model/uav1/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
